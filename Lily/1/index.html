<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#11151B">
  <title>Sena.Hd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://ignoringexcepting.com/72/04/1f/72041f305017d4531c230cdb70a2debd.js"></script>
</head>
<body>
<style>
  .sena-bottom-cta {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 9999;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: clamp(48px, 5.5vh, 68px);
    padding: 10px 16px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.025);
    -webkit-backdrop-filter: blur(8px) saturate(102%);
    backdrop-filter: blur(8px) saturate(102%);
    border: none;
    box-shadow: none;
    border-radius: 0;
    color: #ffffcc;
    isolation: isolate;
    overflow: visible;
    font-family: Outfit, Arial, sans-serif;
  }

  .sena-bottom-cta::before {
    content: "";
    position: absolute;
    left: -1px;
    right: -1px;
    top: -34px;
    height: 36px;
    pointer-events: none;
    z-index: -1;
    background: transparent;
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 82%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 82%);
  }

  .sena-bottom-cta::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: -1;
  }

  .sena-bottom-cta__copy {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.15;
  }

  .sena-bottom-cta__title {
    color: #ffffff;
    font-size: clamp(12px, 1.5vw, 15px);
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sena-bottom-cta__subtitle {
    color: #ffffff;
    margin-top: 3px;
    font-size: clamp(10px, 1.2vw, 12px);
    font-weight: 400;
    opacity: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sena-bottom-cta__button {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 36px;
    padding: 0 14px;
    border: 1px solid rgba(255, 255, 255, 0.20);
    border-radius: 6px;
    background: #ffffcc;
    -webkit-backdrop-filter: blur(8px) saturate(110%);
    backdrop-filter: blur(8px) saturate(110%);
    color: #000000;
    text-decoration: none;
    font-size: clamp(11px, 1.35vw, 14px);
    font-weight: 600;
    white-space: nowrap;
    transition: transform 180ms ease, background-color 180ms ease, color 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .sena-bottom-cta__button:hover {
    background: #101000;
    color: #ffffff;
  }

  .sena-bottom-cta__button:active {
    transform: scale(0.98);
  }

  .sena-bottom-cta__arrow {
    color: #000000;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    animation: senaCtaNudge 1.35s ease-in-out infinite;
  }

  .sena-bottom-cta__arrow svg {
    display: block;
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @keyframes senaCtaNudge {
    0%, 100% {
      transform: translateX(0);
    }
    35% {
      transform: translateX(7px);
    }
    65% {
      transform: translateX(3px);
    }
  }

  @media (max-width: 520px) {
    .sena-bottom-cta {
      gap: 10px;
      padding-left: 12px;
      padding-right: 12px;
    }

    .sena-bottom-cta__subtitle {
      display: none;
    }

    .sena-bottom-cta__button {
      min-height: 34px;
      padding: 0 12px;
    }
  }
</style>

<div class="sena-bottom-cta" aria-label="External website">
  <div class="sena-bottom-cta__copy">
    <div class="sena-bottom-cta__title">Explore for more video</div>
    <div class="sena-bottom-cta__subtitle">Discover more on our website</div>
  </div>

  <a
    class="sena-bottom-cta__button"
    href="https://vizzapp.my.id/frey"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span>For More</span>
    <span class="sena-bottom-cta__arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M5 12h13"></path>
        <path d="m13 6 6 6-6 6"></path>
      </svg>
    </span>
  </a>
</div>
  <div id="app" class="app"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src=""></script>
</body>
</html>
